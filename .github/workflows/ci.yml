name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efederal-build
          path: dist/
          retention-days: 7

      - name: Build QA Visual application
        run: VITE_QA_VISUAL=true npm run build

      - name: Upload QA Visual build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efederal-qa-visual
          path: dist/
          retention-days: 7

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Serve QA Visual in background
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for server
        run: sleep 5

      - name: Run Visual QA Screenshot Test
        run: node scripts/qa/captureVisualQa.mjs

      - name: Upload QA Visual Screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efederal-qa-screenshots
          path: qa-screenshots/
          retention-days: 7
