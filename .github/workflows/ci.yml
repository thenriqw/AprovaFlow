name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efederal-build
          path: dist/
          retention-days: 7

      - name: Build QA Visual application
        run: VITE_QA_VISUAL=true npm run build

      - name: Upload QA Visual build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efederal-qa-visual
          path: dist/
          retention-days: 7
